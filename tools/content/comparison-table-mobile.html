<style id="wa-comparison-table-mobile">
/*
 * The aquaHALT / Flo by Moen / Phyn Plus comparison table, on a phone.
 *
 * The page ships this rule:
 *
 *   @media(max-width:680px){ .aqt-th-f,.aqt-td-f{display:none} .aqt-wrap table{min-width:380px} }
 *
 * which hides the Feature column — the labels — to try to fit four columns onto
 * a phone. Two things go wrong. The labels are what the row MEANS, so without
 * them a row reads "Yes — fixture level | No — mainline only | No — mainline
 * only" with no question attached; eleven rows of that is a wall of answers to
 * nothing. And it still does not fit: dropping the column bought about 22% of
 * width and the third column is left clipped mid-word, so "Yes — 30-day setup"
 * renders as "Yes — 3 / day setup", which misstates a competitor's figure.
 *
 * Below 680px the table becomes one card per feature instead: the label is the
 * card's heading, and each of the three products is a labelled line inside it.
 * Nothing is hidden, nothing is clipped, and there is no sideways scroll to
 * discover.
 *
 * The product labels come from ::before on the cells rather than from markup,
 * because the markup is captured and regenerated — a CSS label survives a
 * rebuild, an edited <td> does not. Cell order in every row is
 * Feature, aquaHALT, Flo by Moen, Phyn Plus, which is what the nth-child
 * selectors rely on.
 */
@media (max-width: 680px) {

  /* the wrapper no longer needs to scroll, because nothing overflows now */
  .aqt-wrap {
    overflow-x: visible !important;
    border: 0 !important;
    border-radius: 0 !important;
  }

  .aqt-wrap table {
    display: block !important;
    min-width: 0 !important;
    width: 100% !important;
  }

  /* the column headings are replaced by the per-cell labels below */
  .aqt-wrap thead { display: none !important; }
  .aqt-wrap tbody { display: block !important; }

  /* one card per feature */
  .aqt-wrap tbody tr {
    display: block !important;
    margin: 0 0 12px !important;
    border: 1px solid #DCE8F5 !important;
    border-radius: 10px !important;
    overflow: hidden !important;
  }

  .aqt-wrap tbody td {
    display: flex !important;
    width: auto !important;
    gap: 8px;
    align-items: baseline;
    padding: 9px 12px !important;
    font-size: 13px !important;
    line-height: 1.45 !important;
  }

  /* the label, restored, as the card heading */
  .aqt-wrap tbody td.aqt-td-f {
    display: block !important;
    background: #1A2F50 !important;
    color: #fff !important;
    font-size: 12.5px !important;
    font-weight: 600 !important;
  }

  /* say which product each line is, since the column headings are gone */
  .aqt-wrap tbody td.aqt-td-a::before,
  .aqt-wrap tbody td.aqt-td-c::before {
    flex: 0 0 94px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .aqt-wrap tbody td.aqt-td-a::before { content: "aquaHALT"; color: #0A3D7A; }
  .aqt-wrap tbody tr > td.aqt-td-c:nth-child(3)::before { content: "Flo by Moen"; color: #8A9BAB; }
  .aqt-wrap tbody tr > td.aqt-td-c:nth-child(4)::before { content: "Phyn Plus"; color: #8A9BAB; }

  /* keep the icon on the same baseline as the text it qualifies */
  .aqt-wrap tbody td .aqt-icon { flex: 0 0 auto; margin-right: 0; }
}
</style>
